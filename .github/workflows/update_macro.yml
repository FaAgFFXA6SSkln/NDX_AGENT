name: Update Macro Data

"on":
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Run script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_macro.py
